[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-agent"
version = "0.1.1"
description = "A local-first personal agent with persistent conversations, memory, and a searchable knowledge base."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["ai", "agent", "llm", "memory", "knowledge-base", "terminal", "harness"]
dependencies = [
    "fastapi",
    "uvicorn",
    "asyncpg",
    "pydantic-settings",
    "trafilatura",
    "pdfplumber",
    "httpx",
    "sentence-transformers",
    "tenacity",
    "prompt-toolkit"
]

[project.urls]
Homepage = "https://github.com/kusuta012/omega"
Repository = "https://github.com/kusuta012/omega"
Issues = "https://github.com/kusuta012/omega/issues"

[project.scripts]
omega = "omega.cli.main:main"

[tool.setuptools.packages.find]
include = ["omega*"]

[tool.setuptools.package-data]
omega = ["resources/*.sql", "resources/*.yml"]